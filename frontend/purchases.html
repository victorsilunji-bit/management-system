<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Purchases</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

<header>
    <h1>Scania Spare Parts Management System</h1>
    <p>Purchases Management</p>
</header>

<nav>
    <a href="index.html">🏠 Dashboard</a>
    <a href="inventory.html" id="inventoryLink">📦 Inventory</a>
    <a href="sales.html" id="salesLink">💰 Sales</a>
    <a href="purchases.html" id="purchasesLink">🚚 Purchases</a>  
     <a href="payments.html" id="paymentsLink">
        💳 Payments
    </a>
    <a href="reports.html" id="reportsLink">📊 Reports</a>
    <a href="staff_management.html" id="usersLink">👥 Staff Management</a>
    <button onclick="logout()">Logout</button>
</nav>

<section class="page-section">
    <h2>Create Purchase</h2>
    <form id="purchaseForm" class="purchase-form">
        <div class="form-grid">
            <div class="form-group">
                <label>Supplier</label>
                <select id="supplier_id" required>
                    <option value="">Select Supplier</option>
                </select>
            </div>
            <div class="form-group">
                <label>Employee</label>
                <select id="employee_id" required>
                    <option value="">Select Employee</option>
                </select>
            </div>
            <div class="form-group">
                <label>Invoice Number</label>
                <input type="text" id="invoice_number" required>
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="status">
                    <option value="Received">Received</option>
                    <option value="Pending">Pending</option>
                </select>
            </div>
        </div>
        <button type="submit" class="btn-primary">Create Purchase</button>
    </form>
</section>

<section class="page-section">
    <h2>Add Purchase Item</h2>
    <form id="itemForm" class="purchase-form">
        <div class="form-grid">
            <div class="form-group">
                <label>Part</label>
                <select id="part_id">
                    <option value="">Select Part</option>
                </select>
            </div>
            <div class="form-group">
                <label>Quantity</label>
                <input type="number" id="quantity" min="1">
            </div>
            <div class="form-group">
                <label>Unit Price</label>
                <input type="number" id="unit_price" min="0" step="0.01">
            </div>
        </div>
        <button type="submit" class="btn-primary">Add Item</button>
    </form>

    <h2>Purchase Items</h2>
    <div class="table-wrapper">
        <table id="purchaseItemsTable">
            <thead>
                <tr>
                    <th>Part</th>
                    <th>Quantity</th>
                    <th>Unit Price</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <p class="total-display">Total Amount: ZMW <span id="totalAmount">0.00</span></p>
</section>

</div>

<script src="js/auth.js"></script>
<script src="js/purchases.js"></script>

</body>
</html>
